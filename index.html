<style>
:root{--g:#245b49;--g2:#36745d;--mint:#e8f1eb;--stone:#f1efe8;--ink:#26352d;--line:#cbd4cc}
*{box-sizing:border-box}body{margin:0;background:#e9ece7;color:var(--ink);font:14px/1.35 Arial,sans-serif}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}
aside{background:var(--g);color:white;padding:20px 13px;position:sticky;top:0;height:100vh;overflow:auto}.brand{padding:5px 8px 17px;border-bottom:1px solid #ffffff40;margin-bottom:13px}.brand small{letter-spacing:1.5px;text-transform:uppercase;opacity:.8}.brand h1{font-size:23px;line-height:1.1;margin:7px 0}.brand p{font-size:12px;opacity:.85}.navlabel{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;opacity:.7;padding:12px 9px 5px}.nav button{display:block;width:100%;border:0;text-align:left;background:transparent;color:#eff7f1;padding:10px;border-radius:8px;margin:2px 0;cursor:pointer;font-size:13px}.nav button:hover,.nav button.active{background:#ffffff22}.tag{float:right;font-size:10px;opacity:.8}.sidefoot{font-size:11px;line-height:1.45;color:#e0ebe4;border-top:1px solid #ffffff30;margin:16px 7px 0;padding-top:12px}
main{padding:22px clamp(12px,3vw,36px) 45px;min-width:0}.toolbar{max-width:920px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.hint{font-size:12px;color:#637168}.actions{display:flex;gap:7px}.action{border:1px solid var(--line);background:white;color:var(--g);border-radius:8px;padding:9px 12px;font-weight:bold;cursor:pointer}.action.primary{background:var(--g);color:white;border-color:var(--g)}
.sheet-side{margin:0 0 18px}.ficha{display:none;max-width:900px;min-height:900px;background:white;margin:0 auto 24px;padding:25px 28px;border-radius:12px;box-shadow:0 5px 22px #263b2d12}.ficha.active{display:block}.hero{background:var(--g);color:white;padding:17px 20px;margin-bottom:14px;border-radius:9px}.hero small{font-size:10px;text-transform:uppercase;letter-spacing:1.5px;opacity:.85}.hero h2{font-size:24px;line-height:1.1;margin:6px 0}.hero p{font-size:12px;margin:0;opacity:.9}.badge{display:inline-block;background:var(--mint);color:var(--g);border-radius:20px;padding:5px 9px;font-size:10px;font-weight:bold;text-transform:uppercase;letter-spacing:.4px;margin-bottom:8px}
.stitle{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--g);font-weight:800;border-bottom:1px solid var(--line);padding-bottom:6px;margin:15px 0 8px}.stitle:before{content:"";display:inline-block;width:5px;height:13px;background:var(--g2);border-radius:4px;margin-right:7px;vertical-align:middle}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:7px 11px}.field{grid-column:span 4}.field.s2{grid-column:span 2}.field.s3{grid-column:span 3}.field.s6{grid-column:span 6}.field.s8{grid-column:span 8}.field.full{grid-column:1/-1}label{display:block;font-size:9px;color:#59675e;font-weight:bold;text-transform:uppercase;letter-spacing:.3px;margin-bottom:3px}
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;font:12px Arial,sans-serif;color:var(--ink);border:0;border-bottom:1px solid #9eaaa1;padding:5px 3px;background:white;outline:none}textarea{border:1px solid var(--line);border-radius:4px;min-height:43px;resize:vertical;padding:6px}
table{width:100%;border-collapse:collapse;font-size:10px;margin:5px 0 8px}th,td{border:1px solid var(--line);padding:5px;vertical-align:middle}th{background:var(--mint);color:var(--g);text-align:left;font-size:9px;text-transform:uppercase}td.center,th.center{text-align:center;width:42px}.box{display:inline-block;width:12px;height:12px;border:1px solid #829087;border-radius:2px}.blank td{height:25px}.note{background:var(--stone);border-left:3px solid #b7b4a7;border-radius:0 5px 5px 0;padding:7px 9px;font-size:10px;margin:8px 0}.note.green{background:#edf4ef;border-left-color:var(--g2)}.footer{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--line);padding-top:7px;margin-top:15px;color:#758178;font-size:9px}
@media screen and (max-width:780px){.app{display:block}aside{height:auto;position:relative;padding:12px}.brand{padding-bottom:8px;margin-bottom:5px}.brand h1{font-size:19px}.nav{display:flex;overflow:auto;gap:4px}.navlabel,.sidefoot{display:none}.nav button{white-space:nowrap;width:auto;flex:0 0 auto}main{padding:12px}.ficha{padding:15px;min-height:0}.field,.field.s2,.field.s3,.field.s6,.field.s8{grid-column:span 6}}
@page{size:A4 portrait;margin:10mm}

.ficha.alertas>.footer{display:none}
.action:focus-visible,.nav button:focus-visible{outline:2px solid #fff;outline-offset:1px}.action:focus-visible{outline-color:var(--g)}
/* Modo preto e branco: sem áreas pintadas, texto preto, contornos fortes (economiza tinta e lê bem em impressora comum) */
.pbopt{display:flex;align-items:center;gap:5px;font-size:12px;color:#59675e;font-weight:bold;text-transform:none;letter-spacing:0;margin:0 4px 0 0;cursor:pointer}.pbopt input{width:auto;margin:0}

/* Impressão: o título verde do topo (hero) não sai em nenhuma ficha; cores dos demais elementos são mantidas */

*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
.hero{display:none!important}
}

/* Aviso de visita: seis bilhetes por folha A4, com campos editáveis */
.aviso-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}

.aviso-title{font-size:14px;line-height:1.1;color:var(--g);font-weight:800;margin:4px 0}

.aviso-card .aviso-date{width:84px;flex:none}.aviso-card .aviso-hour{width:50px;flex:none}

.apres-contact span{display:block;font-size:8.5px;letter-spacing:1px;text-transform:uppercase;color:#42604e;font-weight:800;margin-bottom:1px}
.apres-phone{display:flex;flex-direction:column}
.apres-phone input{width:100%;height:22px;font:inherit;font-size:14px;font-weight:700;color:#1d3c2e;background:transparent;border:0;border-bottom:1.5px solid #6f8c77;border-radius:0;padding:2px;outline:none}
.apres-ubs{border-left:1px solid #b7cdb9;padding-left:12px}
.apres-ubs strong{display:block;font-size:15px;letter-spacing:.3px;color:var(--g)}
.apres-foot{font-size:9.5px;color:#6b7d70;text-align:right;margin:0}
.apres-name input:focus,.apres-phone input:focus{background:#f6faf4;border-bottom-color:var(--g)}
@media screen and (max-width:780px){.apresentacao-card{flex-direction:column}.apres-side{flex-basis:auto}.apres-greeting{margin:10px 0}.apres-contact{grid-template-columns:1fr}.apres-ubs{border-left:0;border-top:1px solid #b7cdb9;padding:6px 0 0}}

<aside><div class="brand"><small>Material de campo</small><h1>Fichário do ACS</h1><p>Fichas independentes • papel A4 • imprima só o que precisar</p></div>

<main><div class="toolbar"><div class="hint">Selecione uma ficha no menu. Na impressão, somente a ficha aberta será enviada para a impressora ou PDF.</div><div class="actions"><label class="pbopt" title="Impressão sem cores: textos pretos, sem áreas pintadas. Também mostra como vai ficar na tela."><input type="checkbox" id="pb"> Preto e branco</label><button class="action" onclick="limpar()">Limpar ficha</button><button class="action primary" onclick="printCurrent()">Imprimir ficha atual</button></div></div>

<script>
let _uid=0;const uid=()=>'c'+(++_uid);

const buttons=[...document.querySelectorAll('.nav button')],pages=[...document.querySelectorAll('.ficha')];
function abrir(id,rolar=true){const alvo=pages.find(p=>p.id===id)||pages[0];pages.forEach(p=>p.classList.toggle('active',p===alvo));buttons.forEach(b=>{const on=b.dataset.id===alvo.id;b.classList.toggle('active',on);if(on)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(rolar)window.scrollTo({top:0,behavior:'smooth'})}
/* Cada ficha tem um link próprio (ex.: index.html#diabetes) */
buttons.forEach(b=>b.addEventListener('click',()=>{abrir(b.dataset.id);if(location.hash!=='#'+b.dataset.id)location.hash=b.dataset.id}));
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1),a=document.querySelector('.ficha.active');if(!a||a.id!==id)abrir(id)});
abrir(location.hash.slice(1),false);

function prepararImpressao(){const p=document.querySelector('.ficha.active');pages.forEach(x=>x.classList.remove('print-target'));p.classList.add('print-target');document.body.classList.add('printing')}
function printCurrent(){prepararImpressao();window.print()}
/* Também vale para Ctrl+P / menu do navegador: imprime só a ficha aberta */
window.addEventListener('beforeprint',prepararImpressao);
window.addEventListener('afterprint',()=>{document.body.classList.remove('printing');pages.forEach(x=>x.classList.remove('print-target'))});

/* Máscara de data dd/mm/aaaa */
document.getElementById('pages').addEventListener('input',e=>{if(e.target.dataset.mask==='date'){const d=e.target.value.replace(/\D/g,'').slice(0,8);e.target.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d}});

const campos=p=>[...p.querySelectorAll('input,textarea,select')];

function limpar(){const p=document.querySelector('.ficha.active');if(!confirm('Limpar os campos preenchidos nesta ficha? Esta ação não pode ser desfeita.'))return;campos(p).forEach(x=>{if(x.type==='checkbox')x.checked=false;else x.value=''})}

document.getElementById('pb').addEventListener('change',e=>document.body.classList.toggle('pb',e.target.checked));
